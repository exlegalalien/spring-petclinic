name: "DevSecOps Security Pipeline"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - main
  schedule:
    # Runs every Monday at 05:00 UTC
    - cron: '0 5 * * 1'

permissions:
  contents: read
  security-events: write
  issues: write
  pull-requests: write

jobs:
  # --------------------------------------------------------------------------
  # 1. Static Application Security Testing (SAST) - Opengrep
  # --------------------------------------------------------------------------
  opengrep-sast:
    name: "Opengrep SAST Analysis"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      # Official Opengrep public runner image
      image: opengrep/opengrep:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # Pin to v4.2.2 commit SHA

      - name: Run Opengrep SAST Scan
        run: |
          # Scan against OWASP Top 10 and CWE Top 25 rulesets, outputting SARIF
          opengrep scan \
            --config "p/default" \
            --config "p/owasp-top-ten" \
            --config "p/cwe-top-25" \
            --sarif \
            --output opengrep-results.sarif \
            --error

      # Upload SARIF directly into GitHub Code Scanning (PR Annotations)
      - name: Upload Opengrep SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@b56ba49b26e50535fa1e7f7db0f4f7b4765d80d1 # Pin to v3.28.10
        if: always()
        with:
          sarif_file: 'opengrep-results.sarif'
          category: 'opengrep-sast'

  # --------------------------------------------------------------------------
  # 2. Infrastructure as Code (IaC) - Checkmarx KICS
  # --------------------------------------------------------------------------
  kics-iac-scan:
    name: "Checkmarx KICS IaC Scan"
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      issues: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Create Scan Results Directory
        run: mkdir -p kics-results

      - name: Run Checkmarx KICS Action
        uses: checkmarx/kics-github-action@246f88126fd9a7217fb0dd51121d5c2199fa68a4 # Pin to v2.1.3
        with:
          path: './'
          output_path: 'kics-results/'
          output_formats: 'json,sarif'
          ignore_on_exit: 'results' # Prevent early abort so issues and SARIF upload finish
          fail_on: 'high,critical'

      - name: Upload KICS SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@b56ba49b26e50535fa1e7f7db0f4f7b4765d80d1
        if: always()
        with:
          sarif_file: 'kics-results/results.sarif'
          category: 'kics-iac'

      - name: Check Finding Thresholds
        run: |
          if [ -f "kics-results/results.json" ]; then
            CRITICAL_COUNT=$(jq '.total_counter.CRITICAL // 0' kics-results/results.json)
            HIGH_COUNT=$(jq '.total_counter.HIGH // 0' kics-results/results.json)
            echo "KICS Scan Complete -> Critical: $CRITICAL_COUNT, High:$HIGH_COUNT"
            if [ "$CRITICAL_COUNT" -gt 0 ] \vert{}\vert{} [ "$HIGH_COUNT" -gt 0 ]; then
              echo "::error::Critical or High IaC vulnerabilities detected by KICS!"
              exit 1
            fi
          fi
