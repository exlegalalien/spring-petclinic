name: "DevSecOps Security Pipeline (Maven & Gradle)"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - main
  schedule:
    # Runs every Monday at 05:00 UTC
    - cron: '0 5 * * 1'

permissions:
  contents: read
  security-events: write
  issues: write
  pull-requests: write

jobs:
  # --------------------------------------------------------------------------
  # 1. Static Application Security Testing (SAST) - Opengrep
  # --------------------------------------------------------------------------
  opengrep-sast:
    name: "Opengrep SAST Analysis"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Opengrep SAST Scan
        uses: opengrep/opengrep-action@v1
        with:
          config: >-
            p/default
            p/java
            p/owasp-top-ten
            p/cwe-top-25
          generateSarif: "1"
          
      # Upload SARIF directly into GitHub Code Scanning (PR Annotations)
      - name: Upload Opengrep SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'opengrep-results.sarif'
          category: 'opengrep-sast'

  # --------------------------------------------------------------------------
  # 2. Build Verification & Dependency Graph Generation
  # --------------------------------------------------------------------------
  build-and-verify:
    name: "Build & Dependency Verification"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle' # Automatically caches Gradle or Maven dependencies

      - name: Verify Gradle Build (if gradlew exists)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew check -x test
          elif [ -f "./pom.xml" ]; then
            mvn compile -DskipTests
          fi

  # --------------------------------------------------------------------------
  # 3. Infrastructure as Code (IaC) - Checkmarx KICS
  # --------------------------------------------------------------------------
  kics-iac-scan:
    name: "Checkmarx KICS IaC Scan"
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      issues: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create Scan Results Directory
        run: mkdir -p kics-results

      - name: Run Checkmarx KICS Action
        uses: checkmarx/kics-github-action@v2.1.20
        with:
          path: './'
          output_path: 'kics-results/'
          output_formats: 'json,sarif'
          ignore_on_exit: 'results'
          fail_on: 'high,critical'

      - name: Upload KICS SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'kics-results/results.sarif'
          category: 'kics-iac'

      - name: Check Finding Thresholds
        if: always()
        run: |
          if [ -f "kics-results/results.json" ]; then
            # Extract Critical and High counts from .severity_counters
            CRITICAL_COUNT=$(jq '(.severity_counters.CRITICAL // .severity_counters.critical // 0)' kics-results/results.json)
            HIGH_COUNT=$(jq '(.severity_counters.HIGH // .severity_counters.high // 0)' kics-results/results.json)

            echo "=========================================="
            echo "KICS Scan Summary:"
            echo "Critical Findings: $CRITICAL_COUNT"
            echo "High Findings:     $HIGH_COUNT"
            echo "=========================================="

            # if [ "$CRITICAL_COUNT" -gt 0 ] || [ "$HIGH_COUNT" -gt 0 ]; then
            #   echo "::error::KICS detected $CRITICAL_COUNT Critical and $HIGH_COUNT High severity IaC vulnerabilities!"
            #   exit 1
            # fi
          else
            echo "::warning::kics-results/results.json not found. Skipping threshold gate."
          fi
