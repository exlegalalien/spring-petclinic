name: "DevSecOps Security Pipeline (Maven & Gradle)"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - main
  schedule:
    # Runs every Monday at 05:00 UTC
    - cron: '0 5 * * 1'

permissions:
  contents: read
  security-events: write
  issues: write
  pull-requests: write

jobs:
  # --------------------------------------------------------------------------
  # 1. Static Application Security Testing (SAST) - Opengrep
  # --------------------------------------------------------------------------
  opengrep-sast:
    name: "Opengrep SAST Analysis"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: opengrep/opengrep:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@7.0.1

      - name: Run Opengrep SAST Scan (Java / Spring / Polyglot)
        run: |
          opengrep scan \
            --config "p/default" \
            --config "p/java" \
            --config "p/owasp-top-ten" \
            --config "p/cwe-top-25" \
            --sarif \
            --output opengrep-results.sarif \
            --error

      # Upload SARIF directly into GitHub Code Scanning (PR Annotations)
      - name: Upload Opengrep SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'opengrep-results.sarif'
          category: 'opengrep-sast'

  # --------------------------------------------------------------------------
  # 2. Build Verification & Dependency Graph Generation
  # --------------------------------------------------------------------------
  build-and-verify:
    name: "Build & Dependency Verification"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle' # Automatically caches Gradle or Maven dependencies

      - name: Verify Gradle Build (if gradlew exists)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew check -x test
          elif [ -f "./pom.xml" ]; then
            mvn compile -DskipTests
          fi

  # --------------------------------------------------------------------------
  # 3. Infrastructure as Code (IaC) - Checkmarx KICS
  # --------------------------------------------------------------------------
  kics-iac-scan:
    name: "Checkmarx KICS IaC Scan"
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      issues: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Create Scan Results Directory
        run: mkdir -p kics-results

      - name: Run Checkmarx KICS Action
        uses: checkmarx/kics-github-action@v2.1.20
        with:
          path: './'
          output_path: 'kics-results/'
          output_formats: 'json,sarif'
          ignore_on_exit: 'results'
          fail_on: 'high,critical'

      - name: Upload KICS SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'kics-results/results.sarif'
          category: 'kics-iac'

      - name: Check Finding Thresholds
        run: |
          if [ -f "kics-results/results.json" ]; then
            CRITICAL_COUNT=$(jq '.total_counter.CRITICAL // 0' kics-results/results.json)
            HIGH_COUNT=$(jq '.total_counter.HIGH // 0' kics-results/results.json)
            echo "KICS Scan Complete -> Critical: $CRITICAL_COUNT, High:$HIGH_COUNT"
            if [ "$CRITICAL_COUNT" -gt 0 ] \vert{}\vert{} [ "$HIGH_COUNT" -gt 0 ]; then
              echo "::error::Critical or High IaC vulnerabilities detected by KICS!"
              exit 1
            fi
          fi
